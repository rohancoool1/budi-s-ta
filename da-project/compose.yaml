services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brass-blade-web
    env_file:
      - ./barbershop-laravel/.env
    environment:
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
    ports:
      - "8000:8000"
    volumes:
      - laravel_storage:/var/www/html/storage
    init: true
    restart: unless-stopped

volumes:
  laravel_storage:
